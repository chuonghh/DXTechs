name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build   # vue-tsc -b && vite build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: /var/www/dxtechs
    steps:
      - name: Check deploy secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it under Settings > Secrets and variables > Actions > Secrets (or Environments > production), not Variables."
              missing=1
            fi
          done
          exit $missing

      # Chỉ lấy thư mục script (ssh-retry.sh); bản build đến từ artifact của job build.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          # Không treo vô hạn khi VPS không phản hồi; phát hiện kết nối chết giữa chừng.
          printf 'Host *\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # scp/ssh đi qua ssh_retry: lỗi kết nối thoáng qua (exit 255, ví dụ sshd MaxStartups ngắt
      # "kex_exchange_identification: Connection reset by peer" — sự cố run #6 ngày 20/11/2026) được thử lại
      # tối đa 4 lần (5s/15s/30s). Lỗi của script hoặc sai key/known_hosts thì KHÔNG thử lại.
      - name: Upload release
        run: |
          source .github/scripts/ssh-retry.sh
          tar -czf dist.tgz -C dist .
          ssh_retry scp -P "$VPS_PORT" -i ~/.ssh/id_deploy dist.tgz "$VPS_USER@$VPS_HOST:/tmp/dxtechs-dist.tgz"

      - name: Activate release
        run: |
          source .github/scripts/ssh-retry.sh
          # Dòng đầu in "[remote] started": từ đây trở đi lỗi KHÔNG được thử lại (release có thể đã kích hoạt một phần).
          cat > remote-activate.sh <<'EOF'
          echo "[remote] started"
          set -euo pipefail
          dir="$APP_DIR/releases/$RELEASE"
          mkdir -p "$dir"
          tar -xzf /tmp/dxtechs-dist.tgz -C "$dir"
          rm -f /tmp/dxtechs-dist.tgz
          test -f "$dir/index.html"
          ln -sfn "$dir" "$APP_DIR/current"
          # keep the 5 newest releases for rollback
          ls -1dt "$APP_DIR"/releases/* | tail -n +6 | xargs -r rm -rf
          # HTTPS first (after certbot, port 80 only redirects/404s), then plain HTTP
          { curl -fsSk https://127.0.0.1/ 2>/dev/null || curl -fsS http://127.0.0.1/; } | grep -q 'id="app"'
          echo "Active release: $RELEASE"
          EOF
          # RELEASE tính MỘT lần trên runner: thử lại vẫn dùng đúng tên thư mục release.
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh_retry --stdin remote-activate.sh ssh -p "$VPS_PORT" -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' RELEASE='$RELEASE' bash -s"
