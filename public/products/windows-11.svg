<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04112E"/>
      <stop offset="50%" stop-color="#082055"/>
      <stop offset="100%" stop-color="#06163A"/>
    </linearGradient>
    <linearGradient id="winBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ADEF"/>
      <stop offset="100%" stop-color="#0078D7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="480" height="320" rx="16" fill="url(#winBg)"/>
  <circle cx="240" cy="150" r="90" fill="#0078D7" opacity="0.15" filter="url(#glow)"/>
  <g transform="translate(175, 85)">
    <rect x="0" y="0" width="60" height="60" rx="4" fill="url(#winBlue)"/>
    <rect x="70" y="0" width="60" height="60" rx="4" fill="url(#winBlue)"/>
    <rect x="0" y="70" width="60" height="60" rx="4" fill="url(#winBlue)"/>
    <rect x="70" y="70" width="60" height="60" rx="4" fill="url(#winBlue)"/>
  </g>
  <text x="240" y="260" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.05em">Windows 11 Pro</text>
  <text x="240" y="285" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#00C2FF" text-anchor="middle" letter-spacing="0.08em">OFFICIAL RETAIL LICENSE</text>
</svg>